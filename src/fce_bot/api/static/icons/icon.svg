<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="snow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  
  <!-- Mount Etna silhouette -->
  <polygon points="56,360 256,120 456,360" fill="#450a0a" opacity="0.6"/>
  <!-- Etna Snow top -->
  <polygon points="256,120 220,165 240,160 256,175 272,160 292,165" fill="url(#snow)"/>
  <!-- Volcano smoke puff -->
  <circle cx="265" cy="95" r="16" fill="#ffffff" opacity="0.7"/>
  <circle cx="280" cy="75" r="22" fill="#ffffff" opacity="0.5"/>
  <circle cx="305" cy="55" r="28" fill="#ffffff" opacity="0.3"/>

  <!-- Train body -->
  <g transform="translate(136, 230)">
    <!-- Main train shell -->
    <rect x="0" y="0" width="240" height="190" rx="40" fill="#ffffff"/>
    <rect x="15" y="15" width="210" height="160" rx="30" fill="#0f172a"/>
    <!-- Windshield glass -->
    <rect x="35" y="30" width="170" height="65" rx="14" fill="#38bdf8"/>
    <!-- Center pillar -->
    <line x1="120" y1="30" x2="120" y2="95" stroke="#0f172a" stroke-width="6"/>
    <!-- Headlights -->
    <circle cx="55" cy="130" r="14" fill="#facc15"/>
    <circle cx="185" cy="130" r="14" fill="#facc15"/>
    <circle cx="120" cy="130" r="10" fill="#dc2626"/>
    <!-- Track bar -->
    <rect x="-15" y="195" width="270" height="12" rx="6" fill="#cbd5e1"/>
  </g>
</svg>